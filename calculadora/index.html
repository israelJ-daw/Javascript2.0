<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora PRO</title>
    <link rel="stylesheet" href="css/css.css" />
    <script src="js/js.js" defer></script>
  </head>

  <body>
    <div class="calculadora">
      <h1>Calculadora PRO</h1>
      <input type="text" id="text" readonly />

      <div class="botones">
        <button class="borrar" onclick="borrar()">AC</button>
        <button class="func" onclick="elevar()">x²</button>
        <button class="operador" onclick="ponerOperador('/')">/</button>

        <button onclick="ponerNumero('7')">7</button>
        <button onclick="ponerNumero('8')">8</button>
        <button onclick="ponerNumero('9')">9</button>
        <button class="operador" onclick="ponerOperador('*')">*</button>

        <button onclick="ponerNumero('4')">4</button>
        <button onclick="ponerNumero('5')">5</button>
        <button onclick="ponerNumero('6')">6</button>
        <button class="operador" onclick="ponerOperador('-')">-</button>

        <button onclick="ponerNumero('1')">1</button>
        <button onclick="ponerNumero('2')">2</button>
        <button onclick="ponerNumero('3')">3</button>
        <button class="operador" onclick="ponerOperador('+')">+</button>

        <button class="cero" onclick="ponerNumero('0')">0</button>
        <button onclick="ponerNumero('.')">.</button>
        <button class="igual" onclick="calcular()">=</button>

      </div>
    </div>
  </body>
</html>
